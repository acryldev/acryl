apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint

metadata:
  id: rejection.override-unknown-param
  name: Override for undeclared parameter
  version: 0.1.0

spec:
  runtime: cordis
  parameters:
    appTitle:
      type: string
      default: ACRYL Zero
  rows:
    - id: welcome
      name: '@acryl/welcome'
      config:
        title: '{{parameters.appTitle}}'
