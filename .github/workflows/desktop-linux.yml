name: Desktop on Linux

# Boots the real Electron Desktop on Linux under a virtual display, exactly as a developer's `corepack pnpm run desktop` does, and fails unless the renderer
# reports healthy. It exists because the Desktop failed to open a window on Ubuntu (advanced shell mode, a missing SUID sandbox, a fresh checkout's build order)
# while every headless gate was green.
on:
  workflow_dispatch:
  push:
    branches: [main, ci-desktop-linux]
    paths:
      - 'apps/acryl-desktop/**'
      - 'runtime/**'
      - 'plugins/**'
      - 'scripts/dev-local.mjs'
      - '.github/workflows/desktop-linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/acryl-desktop/**'
      - 'runtime/**'
      - 'plugins/**'
      - 'scripts/dev-local.mjs'
      - '.github/workflows/desktop-linux.yml'

concurrency:
  group: desktop-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  boot:
    name: Desktop boot (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install a virtual display and the libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0

      # `pnpm run desktop` builds first and then starts Electron, so the budget has to cover the build (about a minute on a busy runner) plus the boot; a 75
      # second budget killed the build before Electron started and read as "the Desktop never started".
      - name: Run the Desktop for up to 4 minutes (what the developer runs)
        run: |
          set +e
          timeout 240 xvfb-run -a --server-args="-screen 0 1280x800x24" corepack pnpm run desktop > desktop.log 2>&1
          echo "exit $?" >> desktop.log
          exit 0

      - name: What the Desktop printed
        if: always()
        run: grep -v "^\s*$" desktop.log | grep -vE "woff2|\.css |\.js |\.map |gzip" | tail -60

      - name: What the Desktop logged
        if: always()
        run: |
          for d in "$HOME/.config/ACRYL Development"*; do
            echo "== $d"
            find "$d" -maxdepth 3 \( -name '*.log' -o -name 'startup.jsonl' \) -print -exec tail -n 40 {} \; 2>/dev/null | cut -c1-300
          done

      # The app writes its own startup record; a window that never opened (or a recovery window) leaves no healthy renderer in it.
      - name: The renderer must have reported healthy
        run: |
          log=$(find "$HOME/.config/ACRYL Development" -name startup.jsonl | head -1)
          test -n "$log" || { echo "no startup record: the Desktop never started"; exit 1; }
          grep -q '"eventName":"renderer.boot.completed".*"rendererStatus":"healthy"' "$log" || { echo "the renderer did not report healthy"; exit 1; }
          echo "renderer healthy"
