name: Desktop on Linux

# Boots the real Electron Desktop on Linux under a virtual display, exactly as a developer's `corepack pnpm run desktop` does, and prints what the app logged.
# Diagnostic and manual: it exists because the Desktop failed to open a window on Ubuntu while every headless gate was green.
on:
  workflow_dispatch:
  push:
    branches: [ci-desktop-linux]

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  boot:
    name: Desktop boot (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install a virtual display and the libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0

      - name: Run the Desktop for 100 seconds (what the developer runs)
        run: |
          set +e
          timeout 100 xvfb-run -a --server-args="-screen 0 1280x800x24" corepack pnpm run desktop > desktop.log 2>&1
          echo "exit $?" >> desktop.log
          exit 0

      - name: What the Desktop printed
        if: always()
        run: grep -v "^\s*$" desktop.log | grep -vE "woff2|\.css |\.js |\.map |gzip" | tail -60

      - name: What the Desktop logged
        if: always()
        run: |
          for d in "$HOME/.config/ACRYL Development"*; do
            echo "== $d"
            find "$d" -maxdepth 3 \( -name '*.log' -o -name 'startup.jsonl' \) -print -exec tail -n 40 {} \; 2>/dev/null | cut -c1-300
          done
