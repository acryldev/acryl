name: Release Candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows:
    name: Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve PNPM store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore PNPM store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify Windows packaging
        run: corepack pnpm --filter acryl-desktop run check:win-package

      - name: Build installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: corepack pnpm --filter acryl-desktop run dist:win

      - name: Build portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: corepack pnpm --filter acryl-desktop run dist:win-portable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: acryl-windows-${{ github.ref_name }}
          path: |
            acryl-desktop/dist/*.exe
            acryl-desktop/dist/*.zip
            acryl-desktop/dist/*.yml
            acryl-desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS smoke artifact
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve PNPM store directory
        id: pnpm-store
        run: echo "dir=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore PNPM store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify macOS packaging
        run: corepack pnpm --filter acryl-desktop run check:mac-package

      - name: Build unsigned smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: corepack pnpm --filter acryl-desktop run dist:mac-smoke

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: acryl-macos-${{ github.ref_name }}
          path: acryl-desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7
