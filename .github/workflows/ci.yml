name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Enable Corepack and prepare pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate

      - name: Resolve PNPM store directory
        id: pnpm-store
        run: echo "dir=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"

      # No restore-keys fallback on purpose: a prefix match restores a store
      # snapshot from another lockfile era, and layering
      # `pnpm install --frozen-lockfile` on top of that foreign state is
      # suspected in broken profile installs downstream (a hoisted dep
      # directory without its package.json). A key miss starts cold
      # instead: slower, hermetic.
      - name: Restore PNPM store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # The one command that is the project's gate: layout and architecture guardrails, then every package's own check (typecheck, tests and build in
      # dependency order). It passes from a clean checkout, which is the point: CI must not keep its own hand-listed copy of a build order that drifts
      # (the stale list here failed every push once `acryl-settings` was added).
      - name: Check
        run: corepack pnpm run check
