name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve PNPM store directory
        id: pnpm-store
        run: echo "dir=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore PNPM store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate repository layout
        run: corepack pnpm run check:layout

      # The workspace packages export their types from a built lib/. On a fresh
      # checkout those are absent, so consumers (acryl-tui -> acetyl-harness-
      # runtime -> acryl-control) cannot typecheck until the providers are built.
      - name: Build workspace type providers
        run: |
          corepack pnpm --filter acryl-control run build
          corepack pnpm --filter acryl-harness-runtime run build

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Test
        run: corepack pnpm run test

      - name: Build
        run: corepack pnpm run build
