# THROWAWAY: regenerate pnpm-lock.yaml on a clean CI runner (local pnpm install
# deadlocks after resolution in the maintainer sandbox; see PR #56). Delete
# this file once the lockfile commit has landed.
name: Lockfile regen
on:
  push:
    branches: [merge-pr-56]

jobs:
  regen:
    runs-on: ubuntu-latest
    env:
      DSH_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate
      - name: Restore PNPM store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Regenerate lockfile
        run: corepack pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile unchanged"
          else
            git commit -m "chore: regenerate pnpm-lock.yaml for acryl-agent-devin (CI regen)"
            git push
          fi
