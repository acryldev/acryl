name: npm publish tarballs

# Publishes already packed and checked tarballs from a draft release's assets (spec 051 T040): npm limits how many NEW packages one IP may create,
# so a first publish of many @acryldev packages from one machine stalls on E429; GitHub's runners publish them instead. The tarballs are packed and
# checked locally (no workspace: ranges, every exports/main/bin target present) and uploaded to a draft release; this job only sends them, in order.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The draft release tag that holds the .tgz assets (and order.txt, one tarball name per line)
        type: string
        required: true
      dist_tag:
        description: The npm dist-tag
        type: string
        default: next

# write: a draft release is visible only to a token that may push.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -D pack
      - name: Publish in order, paced, skipping what is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACRYLDEV_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          npm whoami --userconfig "$RUNNER_TEMP/.npmrc"
          failed=0
          while read -r t; do
            [ -n "$t" ] || continue
            for try in 1 2 3 4 5 6; do
              if npm publish "./pack/$t" --access public --tag "${{ inputs.dist_tag }}" --userconfig "$RUNNER_TEMP/.npmrc" > out.log 2>&1; then echo "published $t"; break; fi
              if grep -qE "cannot publish over|previously published" out.log; then echo "already there $t"; break; fi
              if grep -q E429 out.log; then echo "E429 $t, waiting $((try*60))s"; sleep $((try*60)); continue; fi
              echo "FAIL $t"; grep -E "npm error" out.log | head -3; failed=1; break
            done
            sleep 10
          done < pack/order.txt
          rm -f "$RUNNER_TEMP/.npmrc"
          exit $failed
