name: Release

# Builds unsigned ACRYL desktop artifacts for the 5 targeted platforms and, on a
# `v*` tag, publishes them as a GitHub Release. Each platform builds per-arch so
# a runner only needs the native prebuilds for its own architecture (the
# universal-mac cross-arch prebuild staging is a separate, documented blocker).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release on a tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest        # Apple Silicon
            arch: arm64
            target: mac
            mode: dmg
            artifact: '*.dmg'
          - name: macos-x64
            os: macos-14            # Intel (x64); macos-13 Intel was deprecation-queued
            arch: x64
            target: mac
            mode: dmg
            artifact: '*.dmg'
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            target: linux
            mode: deb
            artifact: '*.deb'
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
            target: linux
            mode: deb
            artifact: '*.deb'
          - name: windows-x64
            os: windows-latest
            arch: x64
            target: win
            mode: nsis
            artifact: '*.exe'
    steps:
      # Windows git rejects the repo's very long docs/workmethodology filename
      # unless core.longpaths is enabled; set it globally before the checkout.
      # NOTE: this does not reliably prevent the failure on GitHub-hosted
      # runners; renaming the overlong file is the durable fix (see ledger).
      - name: Enable Git longpaths
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve PNPM store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore PNPM store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Build the desktop app (canvas + main + native-UI renderer) before
      # electron-builder packages it.
      - name: Build desktop app
        run: |
          corepack pnpm --filter acryl-development-canvas run build
          corepack pnpm --filter acryl-desktop run build

      # Same gates CI requires: a release matrix job must not package/upload
      # anything the repository checks would reject.
      - name: Verify release gates (layout, typecheck, test, closure)
        run: |
          corepack pnpm run check:layout
          corepack pnpm --filter acryl-control run build
          corepack pnpm --filter acryl-harness-runtime run build
          corepack pnpm run typecheck
          corepack pnpm run test
          corepack pnpm --filter acryl-desktop run verify:closure

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          cd acryl-desktop
          node node_modules/electron-builder/cli.js \
            --${{ matrix.target }} ${{ matrix.mode }} \
            --${{ matrix.arch }} \
            --publish never \
            --config.mac.notarize=false \
            --config.npmRebuild=false \
            --config.directories.output=dist/${{ matrix.name }}

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: acryl-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            acryl-desktop/dist/${{ matrix.name }}/${{ matrix.artifact }}
            acryl-desktop/dist/${{ matrix.name }}/*.blockmap
          if-no-files-found: error
          retention-days: 14

  cli:
    name: cli-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            ext: tar.gz
            cli: acryl
          - target: darwin-x64
            os: macos-14
            ext: tar.gz
            cli: acryl
          - target: linux-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
            cli: acryl
          - target: linux-x64
            os: ubuntu-latest
            ext: tar.gz
            cli: acryl
          - target: windows-x64
            os: windows-latest
            ext: zip
            cli: acryl.cmd
    steps:
      # Windows git rejects the repo's very long docs/workmethodology filename
      # unless core.longpaths is enabled before the checkout.
      - name: Enable Git longpaths
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build CLI and runtime
        run: |
          corepack pnpm --filter acryl-control run build
          corepack pnpm --filter acryl-harness-runtime run build
          corepack pnpm --filter acryl-tui run build

      - name: Verify CLI product
        run: |
          corepack pnpm --filter acryl-tui run typecheck
          corepack pnpm --filter acryl-tui run test
          node --test scripts/cli-archive-platform.test.mjs
          node scripts/verify-npm-entrypoint.mjs

      - name: Build portable CLI archive
        run: node scripts/build-cli-archive.mjs ${{ matrix.target }} 24.19.0 release-artifacts

      - name: Smoke test CLI archive without host runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/acryl-cli-smoke && mkdir -p /tmp/acryl-cli-smoke
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Git Bash's tar is GNU tar and cannot read a Zip; prefer unzip,
            # falling back to PowerShell's Expand-Archive (always present).
            if command -v unzip >/dev/null 2>&1; then
              unzip -q release-artifacts/acryl-cli-windows-x64.zip -d /tmp/acryl-cli-smoke
            else
              ZIP_WIN="$(cygpath -w "$PWD/release-artifacts/acryl-cli-windows-x64.zip")"
              OUT_WIN="$(cygpath -w /tmp/acryl-cli-smoke)"
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ZIP_WIN' -DestinationPath '$OUT_WIN' -Force"
            fi
          else
            tar -xf release-artifacts/acryl-cli-${{ matrix.target }}.${{ matrix.ext }} -C /tmp/acryl-cli-smoke
          fi
          CLI="/tmp/acryl-cli-smoke/acryl-cli-${{ matrix.target }}/bin/${{ matrix.cli }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Git Bash runs .cmd through cmd.exe; pass the Windows path form.
            CLI_WIN="$(cygpath -w "$CLI")"
            cmd //c "$CLI_WIN" --version
            (cd /tmp/acryl-cli-smoke && cmd //c "$CLI_WIN" tui --json)
          else
            env PATH=/usr/bin:/bin "$CLI" --version
            (cd /tmp/acryl-cli-smoke && env PATH=/usr/bin:/bin "$CLI" tui --json)
          fi
          HASH=$(node -e "const c=require('crypto');const f=require('fs');console.log(c.createHash('sha256').update(f.readFileSync('release-artifacts/acryl-cli-${{ matrix.target }}.${{ matrix.ext }}')).digest('hex'))")
          grep -q "$HASH" release-artifacts/checksums.txt

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: acryl-cli-${{ matrix.target }}-${{ github.ref_name }}
          path: release-artifacts/acryl-cli-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  npm-publish:
    name: Publish to npm
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build npm surfaces and runtime
        run: |
          corepack pnpm --filter acryl-control run build
          corepack pnpm --filter acryl-harness-runtime run build
          corepack pnpm --filter acryl-tui run build
          corepack pnpm --filter acryl-web run build
          corepack pnpm --filter acryl-web run typecheck
          corepack pnpm --filter acryl-web run test
          corepack pnpm --filter acryl-web run verify:npm

      # Every public surface shares the release tag version. This prevents a
      # Desktop installer, the terminal CLI, and the standalone Web server from
      # drifting into incompatible releases.
      - name: Verify release/package version synchronization
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          for PACKAGE in package.json acryl-control/package.json acryl-harness-runtime/package.json acryl-tui/package.json acryl-web/package.json acryl-desktop/package.json; do
            VERSION="$(node -e "console.log(require('./$PACKAGE').version)")"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::version drift: release tag v${TAG_VERSION} != $PACKAGE version ${VERSION}"
              exit 1
            fi
          done
          echo "versions synchronized (release, CLI, Web, and Desktop): ${TAG_VERSION}"

      - name: Publish acryl-web to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-web.mjs

      - name: Publish acryl CLI to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-cli.mjs

  release:
    name: Publish GitHub release
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify release/package version synchronization
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          for PACKAGE in package.json acryl-control/package.json acryl-harness-runtime/package.json acryl-tui/package.json acryl-web/package.json acryl-desktop/package.json; do
            VERSION="$(node -e "console.log(require('./$PACKAGE').version)")"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::version drift: release tag v${TAG_VERSION} != $PACKAGE version ${VERSION}"
              exit 1
            fi
          done
          echo "versions synchronized (release, CLI, Web, and Desktop): ${TAG_VERSION}"

      - name: Synchronize README downloads with release tag
        run: node scripts/sync-release-readme.mjs "${{ github.ref_name }}"

      - name: Commit synchronized README links
        run: |
          if git diff --quiet -- README.md README.en.md README.zh.md README.i18n.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md README.zh.md README.i18n.yaml
          git commit -m "docs: sync README downloads for ${{ github.ref_name }}"
          git push origin HEAD:main

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate checksums for CLI archives
        shell: bash
        run: |
          cd artifacts
          # Match build-cli-archive.mjs's `<sha256>  <basename>` format so the
          # installer's `awk '$2 == archive'` lookup and the per-archive
          # checksums agree; shasum's `path` field is normalized to the basename.
          find . -type f \( -name 'acryl-cli-*.tar.gz' -o -name 'acryl-cli-*.zip' \) \
            -exec shasum -a 256 {} + \
            | awk '{ hash=$1; name=$2; sub(/.*\//, "", name); print hash "  " name }' \
            | sort > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ACRYL ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: artifacts/**/*
