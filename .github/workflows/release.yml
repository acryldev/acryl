# ACRYL ADE as an installable app on every OS and CPU: a DMG (macOS), an installer (Windows) and a Debian package (Linux), for arm64 and x64.
# Each runner packs this checkout natively with the acrylblends packer (scripts/pack-blank-mac.mjs --from <this folder>): the native packages
# (node-pty, sharp) must be the runner's own. A run on a tag `v*` publishes a GitHub release with the six files; a manual run only uploads them as
# workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      acrylblends_ref:
        description: acrylblends commit, branch or tag the packer comes from
        default: main

permissions:
  contents: write

jobs:
  pack:
    name: pack (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: ade
      - uses: actions/checkout@v4
        with:
          repository: acrylblends/acrylblends
          ref: ${{ inputs.acrylblends_ref || 'main' }}
          path: acrylblends
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: acrylblends/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the framework the packer makes the app with
        working-directory: acrylblends
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # A Debian package is built with fakeroot and dpkg; the hosted image has dpkg, not always fakeroot.
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      # The About window shows the app's package version: a release carries its tag's (v0.1.13 -> 0.1.13), never the template's 0.1.0.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ade
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Pack ACRYL ADE
        working-directory: acrylblends
        shell: bash
        run: node scripts/pack-blank-mac.mjs --from ../ade --product "ACRYL ADE" --arch ${{ matrix.arch }} --out ../out
      - uses: actions/upload-artifact@v4
        with:
          name: ade-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # A release made by hand from a run's artifacts gets this run's files instead.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "ACRYL ADE $GITHUB_REF_NAME" --notes "ACRYL ADE $GITHUB_REF_NAME, ready to install. macOS: open the .dmg (Apple Silicon: arm64, Intel: x64); the app is not signed yet, so the first start is right-click > Open. Windows: run the -win- .exe (arm64 or x64); SmartScreen may ask, More info > Run anyway. Linux: sudo apt install ./ACRYL-ADE-linux-<arch>.deb. Windows and Linux use the git on your machine."
