name: Release Desktop

# The Electron surface of ONE release. `release-cli.yml` calls this workflow for a `v*` tag, so the installers are built in the same run as the CLI and Web archives and
# land in the same `v<version>` GitHub release (nothing is published unless every surface built). `workflow_dispatch` is a dry run of the five installers on their own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, arch: arm64, target: mac, mode: dmg, artifact: '*.dmg' }
          - { name: macos-x64, os: macos-14, arch: x64, target: mac, mode: dmg, artifact: '*.dmg' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, arch: arm64, target: linux, mode: deb, artifact: '*.deb' }
          - { name: linux-x64, os: ubuntu-latest, arch: x64, target: linux, mode: deb, artifact: '*.deb' }
          - { name: windows-x64, os: windows-latest, arch: x64, target: win, mode: nsis, artifact: '*.exe' }
    steps:
      - name: Enable Git longpaths
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with: { persist-credentials: false, submodules: recursive }
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - name: Enable Corepack and the pnpm version the repository pins
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Build and verify desktop surface
        # bash on every OS: the Windows default (PowerShell) does not stop a multi-line script at a failing command, so a failed test or check there did not fail the job.
        shell: bash
        run: |
          corepack pnpm --filter "acryl-desktop..." --workspace-concurrency=1 run build
          corepack pnpm run check:layout
          corepack pnpm run typecheck
          corepack pnpm run test
          corepack pnpm --filter acryl-desktop run verify:closure
      - name: Package ${{ matrix.name }}
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          set -euo pipefail
          cd apps/acryl-desktop
          BUILDER="node node_modules/electron-builder/cli.js"
          COMMON="--publish never --config.mac.notarize=false --config.npmRebuild=false --config.directories.output=dist/${{ matrix.name }}"
          if [ "${{ matrix.target }}" = mac ]; then
            # Without a Developer ID electron-builder leaves a bundle `codesign --verify --strict` rejects (macOS calls a downloaded copy damaged): build the app,
            # seal it ad hoc, then build the DMG from that sealed app.
            $BUILDER --mac dir --${{ matrix.arch }} $COMMON
            APP="$(find dist/${{ matrix.name }} -maxdepth 2 -name ACRYL.app -type d | head -n 1)"
            test -n "$APP"
            node scripts/seal-mac-app.mjs "$APP"
            $BUILDER --mac dmg --${{ matrix.arch }} --prepackaged "$APP" $COMMON
          else
            $BUILDER --${{ matrix.target }} ${{ matrix.mode }} --${{ matrix.arch }} $COMMON
          fi
      # The promise of the product, proven on what is shipped: an agent writes a plugin and the packaged app takes it live (install, run, update, remove, no restart).
      # One native leg per OS; the other legs of an OS are the same code.
      - name: An agent-written plugin installs, runs, updates and is removed live in the built app
        if: matrix.name == 'macos-arm64' || matrix.name == 'windows-x64' || matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          OUT="apps/acryl-desktop/dist/${{ matrix.name }}"
          case "${{ matrix.name }}" in
            macos-arm64)
              EXE="$(find "$OUT" -path '*ACRYL.app/Contents/MacOS/ACRYL' -type f | head -n 1)"
              test -n "$EXE"
              node apps/acryl-desktop/scripts/verify-packaged-self-extension.mjs "$EXE"
              ;;
            windows-x64)
              node apps/acryl-desktop/scripts/verify-packaged-self-extension.mjs "$OUT/win-unpacked/ACRYL.exe"
              ;;
            linux-x64)
              sudo apt-get update -qq
              sudo apt-get install -y -qq xvfb
              EXE="$(find "$OUT/linux-unpacked" -maxdepth 1 -type f -perm -u+x \( -name acryl-desktop -o -name ACRYL \) | head -n 1)"
              test -n "$EXE"
              xvfb-run -a --server-args="-screen 0 1280x800x24" node apps/acryl-desktop/scripts/verify-packaged-self-extension.mjs "$EXE" --arg --no-sandbox
              ;;
          esac
      - name: Create Desktop release receipt
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#desktop-v}"
          VERSION="${VERSION#v}"
          ARTIFACT="$(find apps/acryl-desktop/dist/${{ matrix.name }} -type f -name '${{ matrix.artifact }}' | head -n 1)"
          test -n "$ARTIFACT"
          node scripts/release-manifest.mjs receipt desktop '${{ matrix.name }}' "$VERSION" "$(basename "$ARTIFACT")" "$ARTIFACT" "apps/acryl-desktop/dist/${{ matrix.name }}/release-receipt.json"
      - uses: actions/upload-artifact@v7
        with:
          name: acryl-desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            apps/acryl-desktop/dist/${{ matrix.name }}/${{ matrix.artifact }}
            apps/acryl-desktop/dist/${{ matrix.name }}/*.blockmap
            apps/acryl-desktop/dist/${{ matrix.name }}/release-receipt.json
          if-no-files-found: error
          retention-days: 14
