name: Release Desktop

# The Electron surface of ONE release. `release-cli.yml` calls this workflow for a `v*` tag, so the installers are built in the same run as the CLI and Web archives and
# land in the same `v<version>` GitHub release (nothing is published unless every surface built). `workflow_dispatch` is a dry run of the five installers on their own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, arch: arm64, target: mac, mode: dmg, artifact: '*.dmg' }
          - { name: macos-x64, os: macos-14, arch: x64, target: mac, mode: dmg, artifact: '*.dmg' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, arch: arm64, target: linux, mode: deb, artifact: '*.deb' }
          - { name: linux-x64, os: ubuntu-latest, arch: x64, target: linux, mode: deb, artifact: '*.deb' }
          - { name: windows-x64, os: windows-latest, arch: x64, target: win, mode: nsis, artifact: '*.exe' }
    steps:
      - name: Enable Git longpaths
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with: { persist-credentials: false, submodules: recursive }
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - name: Enable Corepack and the pnpm version the repository pins
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Build and verify desktop surface
        run: |
          corepack pnpm --filter "acryl-desktop..." --workspace-concurrency=1 run build
          corepack pnpm run check:layout
          corepack pnpm run typecheck
          corepack pnpm run test
          corepack pnpm --filter acryl-desktop run verify:closure
      - name: Package ${{ matrix.name }}
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          set -euo pipefail
          cd apps/acryl-desktop
          node node_modules/electron-builder/cli.js --${{ matrix.target }} ${{ matrix.mode }} --${{ matrix.arch }} --publish never --config.mac.notarize=false --config.npmRebuild=false --config.directories.output=dist/${{ matrix.name }}
      - name: Create Desktop release receipt
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#desktop-v}"
          VERSION="${VERSION#v}"
          ARTIFACT="$(find apps/acryl-desktop/dist/${{ matrix.name }} -type f -name '${{ matrix.artifact }}' | head -n 1)"
          test -n "$ARTIFACT"
          node scripts/release-manifest.mjs receipt desktop '${{ matrix.name }}' "$VERSION" "$(basename "$ARTIFACT")" "$ARTIFACT" "apps/acryl-desktop/dist/${{ matrix.name }}/release-receipt.json"
      - uses: actions/upload-artifact@v7
        with:
          name: acryl-desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            apps/acryl-desktop/dist/${{ matrix.name }}/${{ matrix.artifact }}
            apps/acryl-desktop/dist/${{ matrix.name }}/*.blockmap
            apps/acryl-desktop/dist/${{ matrix.name }}/release-receipt.json
          if-no-files-found: error
          retention-days: 14
