name: Release Desktop

# Optional, heavy Electron surface. Triggered by its own desktop-v* tag or
# workflow_dispatch so a CLI change never rebuilds Electron. The `acryl desktop`
# selector fetches installers from this release.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, arch: arm64, target: mac, mode: dmg, artifact: '*.dmg' }
          - { name: macos-x64, os: macos-14, arch: x64, target: mac, mode: dmg, artifact: '*.dmg' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, arch: arm64, target: linux, mode: deb, artifact: '*.deb' }
          - { name: linux-x64, os: ubuntu-latest, arch: x64, target: linux, mode: deb, artifact: '*.deb' }
          - { name: windows-x64, os: windows-latest, arch: x64, target: win, mode: nsis, artifact: '*.exe' }
    steps:
      - name: Enable Git longpaths
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with: { persist-credentials: false, submodules: recursive }
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.8.0, run_install: false }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Build and verify desktop surface
        run: |
          corepack pnpm --filter acryl-development-canvas run build
          corepack pnpm --filter acryl-desktop run build
          corepack pnpm run check:layout
          corepack pnpm run typecheck
          corepack pnpm run test
          corepack pnpm --filter acryl-desktop run verify:closure
      - name: Package ${{ matrix.name }}
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          set -euo pipefail
          cd acryl-desktop
          node node_modules/electron-builder/cli.js --${{ matrix.target }} ${{ matrix.mode }} --${{ matrix.arch }} --publish never --config.mac.notarize=false --config.npmRebuild=false --config.directories.output=dist/${{ matrix.name }}
      - name: Create Desktop release receipt
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#desktop-v}"
          ARTIFACT="$(find acryl-desktop/dist/${{ matrix.name }} -type f -name '${{ matrix.artifact }}' | head -n 1)"
          test -n "$ARTIFACT"
          node scripts/release-manifest.mjs receipt desktop '${{ matrix.name }}' "$VERSION" "$(basename "$ARTIFACT")" "$ARTIFACT" "acryl-desktop/dist/${{ matrix.name }}/release-receipt.json"
      - uses: actions/upload-artifact@v7
        with:
          name: acryl-desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            acryl-desktop/dist/${{ matrix.name }}/${{ matrix.artifact }}
            acryl-desktop/dist/${{ matrix.name }}/*.blockmap
            acryl-desktop/dist/${{ matrix.name }}/release-receipt.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish desktop release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v7
        with: { path: artifacts }
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ACRYL Desktop ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: artifacts/**/*
