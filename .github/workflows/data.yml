name: Data

# The `db` providers that stay in ACRYL (spec 049), Postgres and embedded Postgres, on every operating system and supported Node line: the
# conformance suite of the published `acrylblends/db/conformance`, the ported driver tests and the real Loader tests of each provider. The
# port itself, the SQLite provider and the kv packages are part of `acrylblends`, whose own CI runs them on the same matrix.
# Manual, and on changes to the data packages (a branch proves itself by pushing to ci-data, since a new workflow cannot be dispatched before it is on main). The repository is public, so these runners cost nothing.
on:
  workflow_dispatch:
  push:
    branches: [main, ci-data]
    paths:
      - 'plugins/acryl-db-postgres/**'
      - 'plugins/acryl-db-pglite/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/acryl-db-postgres/**'
      - 'plugins/acryl-db-pglite/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/data.yml'

permissions:
  contents: read

concurrency:
  group: data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  providers:
    name: db providers (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate

      # Only the two providers and what they depend on: they import nothing from the rest of the workspace.
      - name: Install the data packages
        run: corepack pnpm install --frozen-lockfile --filter "acryl-db-postgres..." --filter "acryl-db-pglite..."

      # PGlite (a devDependency) serves the suite over its socket server, so the provider's network driver is tested with no Postgres installed.
      - name: Build, typecheck and test the Postgres provider
        run: corepack pnpm --filter acryl-db-postgres run check

      # PGlite in this process, with its data folder on this runner's file system: the suite, data across a reopen, and the folder lock.
      - name: Build, typecheck and test the embedded Postgres provider
        run: corepack pnpm --filter acryl-db-pglite run check
