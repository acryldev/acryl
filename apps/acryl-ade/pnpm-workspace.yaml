# The ACRYL frame finds its packages in a flat node_modules, as npm lays it out (acrylblends writes this; npm ignores the file).
nodeLinker: hoisted
# The frame's packages whose install scripts npm runs too; pnpm stops an install while a build is neither allowed nor denied.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true
# What the frame does not install (the LibreOffice engines, 153 MB): an empty placeholder, as npm's overrides in package.json. Settings > Plugins > Office preview brings it back.
overrides:
  '@deepseek-ai/libreoffice-kit-darwin-arm64': 'npm:@acryldev/absent@1.0.1'
  '@deepseek-ai/libreoffice-kit-darwin-x64': 'npm:@acryldev/absent@1.0.1'
  '@deepseek-ai/libreoffice-kit-wasm': 'npm:@acryldev/absent@1.0.1'
  '@deepseek-ai/libreoffice-kit-win32-arm64': 'npm:@acryldev/absent@1.0.1'
  '@deepseek-ai/libreoffice-kit-win32-x64': 'npm:@acryldev/absent@1.0.1'
