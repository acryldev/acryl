# Generated by acrylblends: the DSH overlay that mounts the ACRYL frame. Regenerate instead of editing.
- insert:
    - id: app-instance
      name: ./app/runtime.mjs
    - id: acryl-door
      name: ./plugins/acryl-door/src/index.ts
    - id: app-plugins
      name: ./frame/app-plugins.mjs
      isolate: {"extensions":true}
    - id: app-routes
      name: ./src/frame.ts
    - id: acryl-router
      name: '@acryldev/blends/cordis/router'
      config:
        trailingSlash: ignore
    - id: acryl-router-http
      name: '@acryldev/blends/cordis/router-http'
    - id: acryl-web-service
      name: '@acryldev/web'
    - id: acryl-settings
      name: '@acryldev/settings'
    - id: acryl-app-shell
      name: '@acryldev/app-shell'
    - id: acryl-versions
      name: '@acryldev/versions'
    - id: acryl-workspace
      name: '@acryldev/workspace'
      config:
        openFolder: !!js process.env.ACRYL_OPEN_FOLDER
    - id: acryl-plugin-admin
      name: '@acryldev/plugin-admin'
    - id: acryl-system-prompt
      name: '@acryldev/system-prompt'
    - id: acryl-app-context
      name: '@acryldev/app-context'
    - id: acryl-support
      name: '@acryldev/support'
    - id: acryl-sign-in
      name: '@acryldev/sign-in'
    - id: ui-brand-acryl
      name: '@acryldev/brand-client'
    - id: skill-mcp-manager
      name: skill-mcp-manager
- id: connection
  inject: []
  config:
    trustedHosts: !!js "['127.0.0.1', ...(process.env.ACRYL_PUBLIC_ORIGIN ? [new URL(process.env.ACRYL_PUBLIC_ORIGIN).host] : [])]"
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_HOME
- id: office-to-pdf
  disabled: true
- id: ui-brand-official
  disabled: true
