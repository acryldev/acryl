# Generated by acrylblends: the DSH overlay that mounts the ACRYL frame. Regenerate instead of editing.
- insert:
    - id: app-instance
      name: ./app/runtime.mjs
    - id: acryl-door
      name: ./plugins/acryl-door/src/index.ts
      config:
        hostIndex: false
        appBase: /app
    - id: app-plugins
      name: ./frame/app-plugins.mjs
      isolate: {"extensions":true,"home":true}
    - id: app-routes
      name: ./src/frame.ts
    - id: acryl-router
      name: acrylblends/cordis/router
      config:
        trailingSlash: ignore
    - id: acryl-router-http
      name: acrylblends/cordis/router-http
    - id: acryl-web
      name: '@acrylblends/web'
    - id: acryl-settings
      name: '@acrylblends/settings'
    - id: acryl-app-shell
      name: '@acrylblends/app-shell'
    - id: acryl-versions
      name: '@acrylblends/versions'
    - id: acryl-blends-frame
      name: '@acrylblends/blends-frame'
      config:
        appPage: /app
    - id: acryl-plugin-admin
      name: '@acrylblends/plugin-admin'
    - id: acryl-system-prompt
      name: '@acrylblends/system-prompt'
    - id: acryl-app-context
      name: '@acrylblends/app-context'
    - id: acryl-support
      name: '@acrylblends/support'
    - id: acryl-sign-in
      name: '@acrylblends/sign-in'
    - id: ui-brand-acryl
      name: '@acrylblends/brand-client'
- id: connection
  inject: []
  config:
    trustedHosts: !!js "['127.0.0.1', ...(process.env.ACRYL_PUBLIC_ORIGIN ? [new URL(process.env.ACRYL_PUBLIC_ORIGIN).host] : [])]"
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_HOME
- id: ui-brand-official
  disabled: true
