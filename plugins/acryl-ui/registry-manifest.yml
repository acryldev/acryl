# Provenance of every component in src/client/registry (spec 038-ui-component-library, plan.md "Rework after the DSH styling document").
# origin: extracted = copied from the pinned deepseek-harness source (commit 5dda764ed3) with only the coupling removed; composed = built only from the app's own primitives
# and DSH stylesheets; gap = DSH has nothing equivalent, so it is written here (each names what DSH has instead).
source: deepseek-harness 5dda764ed3
components:
  - name: fields
    origin: extracted (verbatim)
    from: packages/client/ui-settings-plugins/src/client/fields.tsx, fields.module.css
    test: byte comparison against the DSH files (tests/library.spec.tsx)
  - name: AppearanceCubes
    origin: extracted
    from: packages/client/ui-theme/src/client/AppearanceRow.tsx, AppearanceRow.module.css
    changed: slot, store and locale coupling replaced by plain props; stylesheet byte-identical
  - name: SettingsRow
    origin: extracted
    from: packages/client/ui-permission-presets/src/client/PermissionRow.tsx and .module.css (row layout)
    changed: the host-backed preference and the risk confirmation stay in the DSH feature
  - name: SelectPill
    origin: extracted
    from: packages/client/ui-permission-presets/src/client/PermissionRow.tsx and .module.css (selector pill over the app's Menu)
    changed: preset store and risk confirmation removed
  - name: Tabs
    origin: extracted
    from: packages/client/ui-settings-plugins/src/client/PluginsSettingsSection.tsx and .module.css (tab strip, panel, keyboard handling)
    changed: slot rendering and locale replaced by plain props
  - name: Card
    origin: extracted (surface only)
    from: packages/client/ui-settings-plugins/src/client/PluginCard.module.css (.card, .cardOpen)
    changed: PluginCard's disclosure behavior stays in the feature; title and footer layout are written here
  - name: SwitchField
    origin: composed
    from: the app's Switch primitive plus fields.module.css .hint
  - name: Dialog
    origin: composed
    from: the app's Modal and Button primitives (DSH's RiskConfirmation covers the acknowledge-first variant)
  - name: EmptyState
    origin: gap
    dsh_has: a bare paragraph with the .empty style in PluginsSettingsSection
  - name: Stack
    origin: gap
    dsh_has: per-feature CSS; runtime direction and gap are inline style values, which the styling rules allow
  - name: ToolCallCard
    origin: extracted (subset)
    from: packages/client/ui-tool/src/client/tool/components/ToolRow.tsx and .module.css
    changed: header, state dot, running sweep, error summary, hidden run-state label and the IN/OUT card kept; tool-specific models, locale, slot renderer and the specialised terminal, diff, read, search, web and image cards left in DSH (the blocks are primitives a consumer passes as children)
  - name: SidebarRow
    origin: extracted
    from: packages/client/ui-sidebar/src/client/SidebarRoot.tsx and .module.css (the New Session bar)
    changed: the rail form is a class on the button itself instead of an ancestor's `.collapsed`
  - name: Kbd
    origin: ported
    from: shadcn/ui registry item `kbd` (style new-york-v4), https://ui.shadcn.com/docs/components/kbd, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module on --dsw-alias-* tokens; cn() replaced by clsx; KbdGroup not ported (use this library's Stack instead)
  - name: Badge
    origin: ported
    from: shadcn/ui registry item `badge` (style new-york-v4), https://ui.shadcn.com/docs/components/badge, MIT licence, fetched 2026-09-22
    changed: cva variants replaced by a CSS Module; asChild/Slot (Radix) dropped; variant names changed to this library's own roles
  - name: Skeleton
    origin: ported
    from: shadcn/ui registry item `skeleton` (style new-york-v4), https://ui.shadcn.com/docs/components/skeleton, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module keyframe
  - name: Spinner
    origin: ported
    from: shadcn/ui registry item `spinner` (style new-york-v4), https://ui.shadcn.com/docs/components/spinner, MIT licence, fetched 2026-09-22
    changed: lucide-react's Loader2Icon replaced by a plain inline SVG arc (no new dependency)
  - name: Alert
    origin: ported
    from: shadcn/ui registry item `alert` (style new-york-v4), https://ui.shadcn.com/docs/components/alert, MIT licence, fetched 2026-09-22
    changed: cva variants and the has-[>svg] grid trick replaced by a CSS Module flex layout
  - name: Separator
    origin: ported
    from: shadcn/ui registry item `separator` (style new-york-v4), https://ui.shadcn.com/docs/components/separator, MIT licence, fetched 2026-09-22
    changed: Radix Separator.Root dropped (a decorative separator needs no interactive behavior); plain div with the same ARIA role
  - name: Progress
    origin: ported
    from: shadcn/ui registry item `progress` (style new-york-v4), https://ui.shadcn.com/docs/components/progress, MIT licence, fetched 2026-09-22
    changed: Radix Progress.Root/Indicator dropped; the same ARIA attributes set directly
  - name: Avatar
    origin: ported
    from: shadcn/ui registry item `avatar` (style new-york-v4), https://ui.shadcn.com/docs/components/avatar, MIT licence, fetched 2026-09-22
    changed: Radix Avatar.Root/Image/Fallback dropped, reproduced with a plain onError state; AvatarBadge/AvatarGroup/AvatarGroupCount not ported (composition-only, no behavior of their own)
  - name: Label
    origin: ported
    from: shadcn/ui registry item `label` (style new-york-v4), https://ui.shadcn.com/docs/components/label, MIT licence, fetched 2026-09-22
    changed: Radix Label.Root dropped; a native <label for> needs no interactive behavior
  - name: Textarea
    origin: ported
    from: shadcn/ui registry item `textarea` (style new-york-v4), https://ui.shadcn.com/docs/components/textarea, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module
  - name: Checkbox
    origin: ported
    from: shadcn/ui registry item `checkbox` (style new-york-v4), https://ui.shadcn.com/docs/components/checkbox, MIT licence, fetched 2026-09-22
    changed: Radix Checkbox.Root/Indicator dropped for a native input; lucide-react's CheckIcon replaced by a plain inline SVG
  - name: AspectRatio
    origin: ported
    from: shadcn/ui registry item `aspect-ratio` (style new-york-v4), https://ui.shadcn.com/docs/components/aspect-ratio, MIT licence, fetched 2026-09-22
    changed: Radix AspectRatio.Root dropped; CSS aspect-ratio needs no JS behavior at all
  - name: Breadcrumb
    origin: ported
    from: shadcn/ui registry item `breadcrumb` (style new-york-v4), https://ui.shadcn.com/docs/components/breadcrumb, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module; asChild/Slot dropped from BreadcrumbLink; lucide-react icons replaced by plain inline SVGs
  - name: Toggle
    origin: ported
    from: shadcn/ui registry item `toggle` (style new-york-v4), https://ui.shadcn.com/docs/components/toggle, MIT licence, fetched 2026-09-22
    changed: Radix Toggle.Root dropped for a native aria-pressed button; cva variants replaced by a CSS Module
  - name: ButtonGroup
    origin: ported
    from: shadcn/ui registry item `button-group` (style new-york-v4), https://ui.shadcn.com/docs/components/button-group, MIT licence, fetched 2026-09-22
    changed: cva variants replaced by a CSS Module; ButtonGroupSeparator no longer depends on this library's own Separator item (would break self-containment) - its own small inline divider instead; asChild/Slot dropped from ButtonGroupText
  - name: Accordion
    origin: ported
    from: shadcn/ui registry item `accordion` (style new-york-v4), https://ui.shadcn.com/docs/components/accordion, MIT licence, fetched 2026-09-22
    changed: Radix Accordion.Root/Item/Trigger/Content dropped for plain React state (an open-item id set); lucide-react's ChevronDownIcon replaced by a plain inline SVG
