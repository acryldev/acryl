  - name: Attachment
    origin: ported
    from: shadcn/ui registry item `attachment` (style new-york-v4), https://ui.shadcn.com/docs/components/attachment, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module on --dsw-alias-* tokens; cva variants became classes; asChild/Slot dropped from AttachmentTrigger, which is a real button type=button; AttachmentAction's ghost icon-button look is restated locally instead of importing the Button item (self-containment); the group-data-[...] reach-across utilities became descendant selectors keyed off the root's data-state/data-size/data-orientation; the shimmer utility is written out as the gradient-and-clip animation it is; scroll-fade-x and scrollbar-none on AttachmentGroup are a mask-image gradient and a hidden scrollbar, which is what those utilities compile to. Its `transition-colors` is kept deliberately, matching upstream. The hazard found in InputGroup does not apply here, and saying why matters more than the decision - that was a transition on a property the same module's :has() rule sets from a DYNAMICALLY TOGGLED ATTRIBUTE (aria-invalid flipped at runtime by user interaction), which is the invalidation path the reported engine split fails on, whereas this one pairs with :hover - a native, continuously tracked pseudo-state on a different path - and upstream ships this exact shape with no evidence of the problem. Diverging here would trade fidelity for a bug that has not been shown to exist
  - name: InputGroup
    origin: ported
    from: shadcn/ui registry item `input-group` (style new-york-v4), https://ui.shadcn.com/docs/components/input-group, MIT licence, fetched 2026-09-22
    changed: shadcn builds this out of its own Input, Textarea and Button items; the two controls and the addon button are plain locally-styled elements instead, so the item has no cross-item import - the exact dependency T040 left this item unported over; the source's has-* variant utilities became :has() selectors on the group, its group-data-[...] utilities descendant selectors, and its dark-mode background utilities dropped because the alias tokens carry both schemes; InputGroupAddon keeps the source's click-to-focus behavior. Two notes on the transition and the addon nudges. The transition is gone entirely. The source's `transition-[color,box-shadow]` names a property that never changes here, an earlier pass of this port diverged to `border-color` so the border would animate, and that divergence paired a transitioned property with the same property being set by the group's own :has() state rules - the shape a reported engine version split fails on, where a repro keeps its :has() override under Chrome 149 and loses it under Chrome 153. Rather than ship the implicated pairing for a 150ms fade, this port keeps no transition. And the addon nudges for a child button and a child kbd are both carried over as :has() rules (-7px and -6px for -0.45rem and -0.35rem), but the source's `[.border-b]:pb-3` and `[.border-t]:pt-3` on the block addons are NOT, because they key on a Tailwind border class a consumer would have to apply, and a consumer cannot reach a hashed module class - the same limitation the FormField port records for its sr-only rule
  - name: FormField
    origin: ported
    from: shadcn/ui registry item `field` (style new-york-v4), https://ui.shadcn.com/docs/components/field, MIT licence, fetched 2026-09-22
    changed: renamed to FormField because this library already exports a Field (the labelled-input adapter in contract-adapters) and a port taking that name would collide with it; FieldLabel and FieldSeparator restate their Label and Separator look locally instead of importing those items (self-containment); data-[variant=...] and group-data-[...] utilities became attribute and descendant selectors; @md/field-group became a real @container query inside the module; the invalid/disabled props set the data-invalid/data-disabled attributes the source's own styles key off but expect the caller to set; the source's [&>.sr-only]:w-auto accommodation is not carried over, because a consumer cannot reach a hashed module class
  - name: Popover
    origin: ported
    from: shadcn/ui registry item `popover` (style new-york-v4), https://ui.shadcn.com/docs/components/popover, MIT licence, fetched 2026-09-22
    changed: Radix Popover dropped and its behavior written by hand - the root owns open state (controlled or defaultOpen), the content is positioned against the trigger's own rect in viewport coordinates with bottom-overflow flipping and re-measure on resize and scroll, Escape and an outside pointerdown close it; asChild/Slot dropped from trigger and anchor, where PopoverAnchor is a wrapper element that registers itself as the position reference; the panel renders in place instead of through a portal to document.body, because a client bundle here may require only react, react/jsx-runtime and the app primitives, and react-dom's createPortal is outside that set (the built-bundle test enforces it) - the trade is that an ancestor with overflow hidden or a transform can clip the panel; Radix's transform-origin variable and its enter/exit animations have no equivalent, so this port animates nothing rather than inventing keyframes; the source's shadow-md became the app's raised surface plus a border, because the token set has no shadow token. Focus is applied from an effect keyed on the applied position rather than beside the first measure - the panel starts visibility:hidden and the measure clears that through a state update, so a focus() in the same commit is a no-op on a hidden element; verified in Chromium, where focus lands on the panel on open
  - name: Slider
    origin: ported
    from: shadcn/ui registry item `slider` (style new-york-v4), https://ui.shadcn.com/docs/components/slider, MIT licence, fetched 2026-09-22
    changed: Radix Slider dropped and the behavior written by hand - each thumb is role=slider carrying aria-valuemin/valuemax/valuenow/orientation, moved by arrow keys (one step), PageUp/PageDown (ten) and Home/End, or dragged with pointer capture and a value computed from the track's own rect and clamped against its neighbour so the thumbs cannot cross; a press on the track moves the nearest thumb; the source's bg-white thumb face became --dsw-alias-bg-layer-1 and its ring-ring/50 hover and focus rings became the app's interactive surface
  - name: Sheet
    origin: ported
    from: shadcn/ui registry item `sheet` (style new-york-v4), https://ui.shadcn.com/docs/components/sheet, MIT licence, fetched 2026-09-22
    changed: Radix Dialog dropped and its behavior written by hand - open state in the root, focus onto the panel as it opens and back to the trigger on close, Tab wrapping inside the panel, and Escape, an overlay press or the close button to dismiss; there is no portal, so SheetPortal does not exist and the panel renders where it sits in the tree (being position fixed it lands in the same place, but an ancestor with overflow hidden or a transform can clip it), because a client bundle here may require only react, react/jsx-runtime and the app primitives and react-dom's createPortal is outside that set; the page behind is NOT made inert, so assistive tech can still reach it while the sheet is open - Radix marks the rest aria-hidden, and closing that needs either the app's Modal (centered by design, its panel styling in DSH CSS, so it cannot become a side sheet) or an inert-based pass over the app root, which is a product decision rather than a port decision; lucide-react XIcon replaced by a plain inline SVG; the source's bg-black/50 overlay became --dsw-alias-bg-overlay; its animate-in/out and slide-in/out utilities have no equivalent here, so this port animates nothing rather than inventing keyframes. Observed in the running app - Escape dismisses the sheet AND the Settings view it is opened inside, because both listen for Escape on document - the innermost-layer convention would need the surrounding view to yield, which is not this item's to change
  - name: Drawer
    origin: ported
    from: shadcn/ui registry item `drawer` (style new-york-v4), https://ui.shadcn.com/docs/components/drawer, MIT licence, fetched 2026-09-22
    changed: vaul dropped and its behavior written by hand, reusing the overlay pattern the Sheet port established - open state in the root, overlay and panel positioned from the direction, Escape or an overlay press to dismiss, focus onto the panel and back to the trigger, and Tab wrapped inside; the drag is arithmetic on the panel's own rect, where a press on the panel that does not start on a control captures the pointer, movement is projected onto the axis with the sign taken from the direction, and releasing past a quarter of the panel's extent dismisses while anything shorter springs back through the module's transition; there is no portal, for the same reason Sheet has none, so DrawerPortal does not exist and the panel renders in place (it lands identically because it is position fixed, but an ancestor with overflow hidden or a transform can clip it); vaul's velocity-based dismissal, background scaling and snap points are NOT implemented, so a fast short flick springs back instead of dismissing; the source's bg-black/50 overlay became --dsw-alias-bg-overlay and its max-h-[80vh] became a plain 80vh
  - name: Command
    origin: ported
    from: shadcn/ui registry item `command` (style new-york-v4), https://ui.shadcn.com/docs/components/command, MIT licence, fetched 2026-09-22
    changed: cmdk dropped and its behavior written by hand - the root owns the query and a registry of the items mounted under it (filter text, disabled flag and select handler), each item applies its own visibility from the query so a filtered-out item is display-none rather than faded, and the keyboard walks the surviving items in DOM order read from the DOM at key time rather than tracked in state, because React registers children bottom-up and would otherwise reverse it; arrows, Home/End and Enter move and choose, and the chosen item scrolls into view with block nearest; matching is a case-insensitive substring falling back to every-word-present, a substitution for cmdk's fuzzy scorer; CommandDialog is NOT ported, because it composes shadcn's own Dialog item and the ingest gate rejects a cross-item import - a consumer composes this Command inside this library's Dialog; lucide-react SearchIcon became a plain inline SVG, and cmdk's own [cmdk-*] attribute selectors became the data-slot hooks this item already publishes
  - name: Combobox
    origin: ported
    from: shadcn/ui registry item `combobox` (style new-york-v4), https://ui.shadcn.com/docs/components/combobox, MIT licence, fetched 2026-09-22
    changed: Base UI's Combobox dropped and its behavior written by hand, restating the anchored-listbox shape from docs/pattern-anchored-listbox.md (the anchoring half from Popover's port, the filtering listbox half from Command's) and restating InputGroup's chrome for its own field as that document's Restating InputGroup's chrome section requires - the source's ComboboxInput IS an InputGroup and ComboboxClear renders shadcn's Button, both cross-item imports the ingest gate rejects, so the group, its addons and its control are restated locally with the same hooks (data-slot=input-group, data-align, the input-group-control slot) so a caller's styles keep working; the panel is measured from the anchor's own rect with a viewport-bounded height, instead of leaning on Base UI's --anchor-width/--available-width/--available-height/--transform-origin positioner variables, and there is no portal, so an ancestor with overflow hidden or a transform can clip it; DELIBERATE PARTIAL - this pass is single-select only, and the multi-select chips family (ComboboxChips, ComboboxChip, ComboboxChipsInput) is a recorded follow-up, alongside ComboboxCollection, which is Base UI's render-prop grouping helper with no local meaning; Base UI's data-highlighted hook is kept for the active row because that is what a caller styles against, with data-selected for the chosen one and data-open/data-empty for the panel; the source's animate-in/fade-in-0/zoom-in-95 animations are not ported; lucide-react ChevronDownIcon, CheckIcon and XIcon became plain inline SVGs
  - name: ContextMenu
    origin: ported
    from: shadcn/ui registry item `context-menu` (style new-york-v4), https://ui.shadcn.com/docs/components/context-menu, MIT licence, fetched 2026-09-22
    changed: Radix ContextMenu dropped and its behavior written by hand, restating the anchored-listbox shape from docs/pattern-anchored-listbox.md for the anchoring and dismissal half, with two differences the source forces - the anchor is the pointer's coordinates captured from the contextmenu event rather than an element's rect, and there is no query so the keyboard walks every item instead of a filtered subset; asChild/Slot is not ported, so the trigger is a wrapper element carrying tabIndex 0, because focus has to be restorable to it on close and a keyboard user has to be able to reach it; DELIBERATE PARTIAL - the submenu family (ContextMenuSub, ContextMenuSubTrigger, ContextMenuSubContent) is a recorded follow-up, since a submenu is a nested anchored panel with hover-intent and that is a different problem from the base menu; ContextMenuPortal does not exist, for the same reason Sheet and Popover have none, because react-dom's createPortal is outside the set a client bundle may require, so an ancestor with overflow hidden or a transform can clip the panel; Radix's collision-aware positioning is not reproduced, this port clamps the panel to the viewport instead; enter and exit animations are not ported; lucide-react CheckIcon became a plain inline SVG
  - name: Carousel
