  - name: Pagination
    origin: ported
    from: shadcn/ui registry item `pagination` (style new-york-v4), https://ui.shadcn.com/docs/components/pagination, MIT licence, fetched 2026-09-22
    changed: PaginationLink is built on shadcn's own Button item in the source (buttonVariants); the ghost/outline link look is restated locally in this module instead of importing that item (self-containment); lucide-react chevrons replaced by plain inline SVGs; hidden sm:block kept as a width query
  - name: NativeSelect
    origin: ported
    from: shadcn/ui registry item `native-select` (style new-york-v4), https://ui.shadcn.com/docs/components/native-select, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module on --dsw-alias-* tokens; the source's five-way IconPlaceholder reduced to one plain inline SVG; its dark-mode variant utilities dropped because the alias tokens carry both schemes (no theme selectors); NativeSelectOption/OptGroup kept as pass-throughs that deliberately add nothing, leaving the popup to the platform
  - name: ScrollArea
    origin: ported
    from: shadcn/ui registry item `scroll-area` (style new-york-v4), https://ui.shadcn.com/docs/components/scroll-area, MIT licence, fetched 2026-09-22
    changed: Radix Root/Viewport/ScrollAreaScrollbar/Thumb/Corner dropped - the platform's own scroller already does what Radix reimplements in JavaScript, so the viewport keeps overflow:auto and the module styles the real scrollbar with --dsw-alias-scrollbar-* tokens; ScrollBar is not exported, because a separate thumb element would be decoration with no behaviour behind it; overscroll-behavior replaces Radix's scroll-chaining guard; the Root keeps its full div attributes (className, style) as the source's Root does, which is what lets a caller set the definite height a scroller needs - a first pass narrowed these to className only, and the real-browser check caught the result, because the viewport grew to its content instead of scrolling
  - name: InputOTP
    origin: ported
    from: shadcn/ui registry item `input-otp` (style new-york-v4), https://ui.shadcn.com/docs/components/input-otp, MIT licence, fetched 2026-09-22
    changed: the input-otp package dropped for one real <input> covering a row of slots plus a context carrying each slot's character, active state and caret blink - typing, backspace, arrows and paste stay the platform's own behaviour rather than a reimplementation; lucide-react MinusIcon replaced by a plain inline SVG; the dark-mode variant utilities dropped because the alias tokens carry both schemes
  - name: Item
    origin: ported
    from: shadcn/ui registry item `item` (style new-york-v4), https://ui.shadcn.com/docs/components/item, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module on --dsw-alias-* tokens; cva variants became classes; asChild/Slot dropped; ItemSeparator restates a one-rule divider locally instead of importing this library's Separator item (self-containment, the ButtonGroupSeparator precedent); the source's group-has-[[data-slot=item-description]] rule became a :has() selector and its sibling rule a sibling selector
  - name: Attachment
    origin: ported
    from: shadcn/ui registry item `attachment` (style new-york-v4), https://ui.shadcn.com/docs/components/attachment, MIT licence, fetched 2026-09-22
    changed: Tailwind utility classes replaced by a CSS Module on --dsw-alias-* tokens; cva variants became classes; asChild/Slot dropped from AttachmentTrigger, which is a real button type=button; AttachmentAction's ghost icon-button look is restated locally instead of importing the Button item (self-containment); the group-data-[...] reach-across utilities became descendant selectors keyed off the root's data-state/data-size/data-orientation; the shimmer utility is written out as the gradient-and-clip animation it is; scroll-fade-x and scrollbar-none on AttachmentGroup are a mask-image gradient and a hidden scrollbar, which is what those utilities compile to
  - name: InputGroup
    origin: ported
    from: shadcn/ui registry item `input-group` (style new-york-v4), https://ui.shadcn.com/docs/components/input-group, MIT licence, fetched 2026-09-22
    changed: shadcn builds this out of its own Input, Textarea and Button items; the two controls and the addon button are plain locally-styled elements instead, so the item has no cross-item import - the exact dependency T040 left this item unported over; the source's has-* variant utilities became :has() selectors on the group, its group-data-[...] utilities descendant selectors, and its dark-mode background utilities dropped because the alias tokens carry both schemes; InputGroupAddon keeps the source's click-to-focus behavior. Two deliberate differences in the transition and the addon nudges. The source's `transition-[color,box-shadow]` becomes border-color and box-shadow, because `color` never animated the border the caller actually sees - the base rule sets that border color explicitly, so Tailwind's choice leaves the change to snap; transitioning border-color makes it animate. And the addon nudges for a child button and a child kbd are both carried over as :has() rules (-7px and -6px for -0.45rem and -0.35rem), but the source's `[.border-b]:pb-3` and `[.border-t]:pt-3` on the block addons are NOT, because they key on a Tailwind border class a consumer would have to apply, and a consumer cannot reach a hashed module class - the same limitation the FormField port records for its sr-only rule
  - name: FormField
    origin: ported
    from: shadcn/ui registry item `field` (style new-york-v4), https://ui.shadcn.com/docs/components/field, MIT licence, fetched 2026-09-22
    changed: renamed to FormField because this library already exports a Field (the labelled-input adapter in contract-adapters) and a port taking that name would collide with it; FieldLabel and FieldSeparator restate their Label and Separator look locally instead of importing those items (self-containment); data-[variant=...] and group-data-[...] utilities became attribute and descendant selectors; @md/field-group became a real @container query inside the module; the invalid/disabled props set the data-invalid/data-disabled attributes the source's own styles key off but expect the caller to set; the source's [&>.sr-only]:w-auto accommodation is not carried over, because a consumer cannot reach a hashed module class
  - name: Popover
    origin: ported
    from: shadcn/ui registry item `popover` (style new-york-v4), https://ui.shadcn.com/docs/components/popover, MIT licence, fetched 2026-09-22
    changed: Radix Popover dropped and its behavior written by hand - the root owns open state (controlled or defaultOpen), the content is positioned against the trigger's own rect in viewport coordinates with bottom-overflow flipping and re-measure on resize and scroll, Escape and an outside pointerdown close it; asChild/Slot dropped from trigger and anchor, where PopoverAnchor is a wrapper element that registers itself as the position reference; the panel renders in place instead of through a portal to document.body, because a client bundle here may require only react, react/jsx-runtime and the app primitives, and react-dom's createPortal is outside that set (the built-bundle test enforces it) - the trade is that an ancestor with overflow hidden or a transform can clip the panel; Radix's transform-origin variable and its enter/exit animations have no equivalent, so this port animates nothing rather than inventing keyframes; the source's shadow-md became the app's raised surface plus a border, because the token set has no shadow token. Focus is applied from an effect keyed on the applied position rather than beside the first measure - the panel starts visibility:hidden and the measure clears that through a state update, so a focus() in the same commit is a no-op on a hidden element; verified in Chromium, where focus lands on the panel on open
  - name: Slider
    origin: ported
    from: shadcn/ui registry item `slider` (style new-york-v4), https://ui.shadcn.com/docs/components/slider, MIT licence, fetched 2026-09-22
    changed: Radix Slider dropped and the behavior written by hand - each thumb is role=slider carrying aria-valuemin/valuemax/valuenow/orientation, moved by arrow keys (one step), PageUp/PageDown (ten) and Home/End, or dragged with pointer capture and a value computed from the track's own rect and clamped against its neighbour so the thumbs cannot cross; a press on the track moves the nearest thumb; the source's bg-white thumb face became --dsw-alias-bg-layer-1 and its ring-ring/50 hover and focus rings became the app's interactive surface
  - name: Sheet
    origin: ported
    from: shadcn/ui registry item `sheet` (style new-york-v4), https://ui.shadcn.com/docs/components/sheet, MIT licence, fetched 2026-09-22
    changed: Radix Dialog dropped and its behavior written by hand - open state in the root, focus onto the panel as it opens and back to the trigger on close, Tab wrapping inside the panel, and Escape, an overlay press or the close button to dismiss; there is no portal, so SheetPortal does not exist and the panel renders where it sits in the tree (being position fixed it lands in the same place, but an ancestor with overflow hidden or a transform can clip it), because a client bundle here may require only react, react/jsx-runtime and the app primitives and react-dom's createPortal is outside that set; the page behind is NOT made inert, so assistive tech can still reach it while the sheet is open - Radix marks the rest aria-hidden, and closing that needs either the app's Modal (centered by design, its panel styling in DSH CSS, so it cannot become a side sheet) or an inert-based pass over the app root, which is a product decision rather than a port decision; lucide-react XIcon replaced by a plain inline SVG; the source's bg-black/50 overlay became --dsw-alias-bg-overlay; its animate-in/out and slide-in/out utilities have no equivalent here, so this port animates nothing rather than inventing keyframes. Observed in the running app - Escape dismisses the sheet AND the Settings view it is opened inside, because both listen for Escape on document - the innermost-layer convention would need the surrounding view to yield, which is not this item's to change
